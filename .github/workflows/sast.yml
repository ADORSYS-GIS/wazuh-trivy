name: Static Application Security Testing (SAST)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sast-shell:
    # Uses: ShellCheck for scan
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-shell.yml@76c60a916e8a273dd753e03d3b19c8b4ccc4e692
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read
      actions: read
      checks: write
